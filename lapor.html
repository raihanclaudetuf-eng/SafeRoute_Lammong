<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Relawan - Navigasi Banjir</title>
    <style>
      :root {
        --bg-light: #f8fafc;
        --surface: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --accent-blue: #3b82f6;
        --accent-hover: #2563eb;
      }

      body {
        background-color: var(--bg-light);
        color: var(--text-main);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 90vh;
        margin: 0;
      }
      .panel {
        background-color: var(--surface);
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 500px;
        border: 1px solid var(--border-color);
        border-top: 5px solid var(--accent-blue);
        box-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }
      h2 {
        color: var(--text-main);
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.6rem;
      }
      p.subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: -10px;
        margin-bottom: 25px;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-main);
        font-size: 0.95rem;
      }
      select {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 20px;
        background: var(--bg-light);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s;
        box-sizing: border-box;
      }
      select:focus {
        border-color: var(--accent-blue);
      }
      button {
        width: 100%;
        padding: 14px;
        background: var(--accent-blue);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: 700;
        text-transform: uppercase;
        transition:
          background-color 0.2s,
          transform 0.1s;
      }
      button:hover {
        background: var(--accent-hover);
      }
      button:active {
        transform: scale(0.98);
      }
      .link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        transition: color 0.2s;
      }
      .link:hover {
        color: var(--accent-blue);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>💧 Panel Relawan</h2>
      <p class="subtitle">Laporkan kondisi genangan jalan saat ini.</p>

      <label>Update Kedalaman Air (Jalan Raya):</label>
      <select id="input-kedalaman">
        <option value="Kering (Aman)">Kering (Aman)</option>
        <option value="Semata kaki (~10 cm)">Semata Kaki (~10 cm)</option>
        <option value="Selutut (~50 cm)">Selutut (~50 cm)</option>
        <option value="Seban / Setengah Body (~80 cm)">
          Seban / Setengah Body (~80 cm)
        </option>
        <option value="Seleher / Tenggelam (> 1 Meter)">
          Tenggelam (> 1 Meter)
        </option>
      </select>

      <label>Kondisi Arus:</label>
      <select id="input-arus">
        <option value="Tenang">Tenang (Menggenang)</option>
        <option value="Deras">Deras (Membahayakan)</option>
      </select>

      <button onclick="simpanLaporan()">Kirim Laporan</button>
      <a href="index.html" class="link">&larr; Kembali ke Halaman Utama</a>
    </div>

    <script>
      // Ambil data yang tersimpan sebelumnya
      if (localStorage.getItem("banjir_kedalaman")) {
        document.getElementById("input-kedalaman").value =
          localStorage.getItem("banjir_kedalaman");
        document.getElementById("input-arus").value =
          localStorage.getItem("banjir_arus");
      }

      function simpanLaporan() {
        const kedalaman = document.getElementById("input-kedalaman").value;
        const arus = document.getElementById("input-arus").value;

        // Simpan ke memory
        localStorage.setItem("banjir_kedalaman", kedalaman);
        localStorage.setItem("banjir_arus", arus);

        alert(`Laporan Terkirim!\nKedalaman: ${kedalaman}\nArus: ${arus}`);
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
