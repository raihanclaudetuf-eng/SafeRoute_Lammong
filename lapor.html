<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Relawan - Navigasi Banjir</title>

    <!-- Firebase App & Realtime Database SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
      :root {
        --bg-light: #f8fafc;
        --surface: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --accent-blue: #3b82f6;
        --accent-hover: #2563eb;
      }

      body {
        background-color: var(--bg-light);
        color: var(--text-main);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 90vh;
        margin: 0;
      }
      .panel {
        background-color: var(--surface);
        padding: 40px;
        border-radius: 12px;
        width: 100%;
        max-width: 500px;
        border: 1px solid var(--border-color);
        border-top: 5px solid var(--accent-blue);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: var(--text-main);
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.6rem;
      }
      p.subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
        margin-top: -10px;
        margin-bottom: 25px;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-main);
        font-size: 0.95rem;
      }
      select {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 20px;
        background: var(--bg-light);
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        outline: none;
        cursor: pointer;
        box-sizing: border-box;
      }
      button {
        width: 100%;
        padding: 14px;
        background: var(--accent-blue);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 1.1rem;
        cursor: pointer;
        font-weight: 700;
        text-transform: uppercase;
      }
      button:hover {
        background: var(--accent-hover);
      }
      .link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
      }
      .link:hover {
        color: var(--accent-blue);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>💧 Panel Relawan</h2>
      <p class="subtitle">Laporkan kondisi genangan jalan secara real-time.</p>

      <label>Update Kedalaman Air (Jalan Raya):</label>
      <select id="input-kedalaman">
        <option value="Kering (Aman)">Kering (Aman)</option>
        <option value="Semata kaki (~10 cm)">Semata Kaki (~10 cm)</option>
        <option value="Selutut (~50 cm)">Selutut (~50 cm)</option>
        <option value="Seban / Setengah Body (~80 cm)">
          Seban / Setengah Body (~80 cm)
        </option>
        <option value="Seleher / Tenggelam (> 1 Meter)">
          Tenggelam (> 1 Meter)
        </option>
      </select>

      <label>Kondisi Arus:</label>
      <select id="input-arus">
        <option value="Tenang">Tenang (Menggenang)</option>
        <option value="Deras">Deras (Membahayakan)</option>
      </select>

      <button onclick="simpanLaporan()">Kirim Laporan Real-Time</button>
      <a href="index.html" class="link">&larr; Kembali ke Halaman Utama</a>
    </div>

    <script>
      // Inisialisasi Firebase
      const firebaseConfig = {
        databaseURL: "https://safe-cfd6d-default-rtdb.firebaseio.com/", // Ganti dengan URL Firebase kamu
      };
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      const db = firebase.database();

      function simpanLaporan() {
        const kedalaman = document.getElementById("input-kedalaman").value;
        const arus = document.getElementById("input-arus").value;

        // Kirim data secara online ke Firebase Realtime Database
        db.ref("laporan_terkini").set(
          {
            kedalaman: kedalaman,
            arus: arus,
            waktu: new Date().toLocaleTimeString(),
          },
          (error) => {
            if (error) {
              alert("Gagal mengirim laporan!");
            } else {
              alert(
                `Laporan Berhasil Terkirim Secara Real-Time!\nKedalaman: ${kedalaman}\nArus: ${arus}`,
              );
              window.location.href = "index.html";
            }
          },
        );
      }
    </script>
  </body>
</html>
